[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carrot"
version = "0.3.3"
description = "Carrot - On-device AI assistant with structured memory, local document search, agent tools, and hybrid model routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    # The http2 extra is not optional. The page reader speaks HTTP/2 because
    # its headers claim to be Chrome, and a client that claims Chrome while
    # speaking HTTP/1.1 is refused by Wikipedia among others. Without `h2`
    # installed httpx raises on `http2=True`, so this has to be declared
    # rather than inherited from whatever else happens to pull it in.
    "httpx[http2]>=0.27.0",
    "feedparser>=6.0.11",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    # The maintained successor to duckduckgo-search, which was abandoned and
    # now proxies to Bing and returns unrelated results.
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
]

[project.scripts]
carrot = "carrot.main:main"

[project.optional-dependencies]
dev = ["pytest", "httpx", "pylint"]
# Optional cloud escalation. Carrot is fully functional without it — install
# only if you want the router to send hard reasoning work to a frontier model.
cloud = ["anthropic>=0.69.0"]
# Optional ANN backend. Without it the vector store falls back to a numpy scan,
# which is fine well past 100k vectors.
vectors = ["sqlite-vec>=0.1.6"]
speech = ["kokoro-onnx>=0.4.0", "sounddevice>=0.4.6"]
# Ambient Recall: reading the screen. `mss` takes the frame; the OCR engine
# is platform-specific and deliberately not pinned here — on Windows it is
# already in the operating system and needs only `winsdk`, and elsewhere it is
# Tesseract, which is a system package rather than a wheel. The pack probes
# for whichever is present and says what to install when neither is.
ambient = ["mss>=9.0.0", "pillow>=10.0.0"]
ambient-windows = ["mss>=9.0.0", "pillow>=10.0.0", "winsdk>=1.0.0b10"]
ambient-tesseract = ["mss>=9.0.0", "pillow>=10.0.0", "pytesseract>=0.3.10"]
# Browser control for Carrot Agent. Needs a one-time browser download after
# install: `python -m playwright install chromium`. Without it the Agent tab
# says so instead of failing mid-task.
browser = ["playwright>=1.49.0"]
# Direct mouse and keyboard control. Off by default even once installed — it
# has to be switched on in Settings before the policy kernel will allow it.
desktop = ["pyautogui>=0.9.54"]
# The Animation pack's renderer. Large — manim pulls in a full OpenGL and
# typesetting stack, and the install is a few hundred megabytes — which is why
# the pack ships switched off and everything else in Carrot works without it.
# `imageio-ffmpeg` is not optional alongside it: manim encodes through ffmpeg
# and looks for it on PATH, which on Windows it will not be. The bundled binary
# means a pip install of this extra is the whole setup. LaTeX stays out on
# purpose — it is a system package, and scenes written with Text() never
# need it.
animation = ["manim>=0.18.0", "imageio-ffmpeg>=0.5.0"]
# Charts. Not a Carrot dependency in the ordinary sense — the plotting script
# runs in the user's own Python through run_command, not inside the app — but
# it is the library the model is told to reach for, so a machine without it
# fails at the advertised path. Settings → Add-ons installs it into the
# interpreter that will actually do the importing; this extra is for people
# who would rather do it at install time.
charts = ["matplotlib>=3.8.0"]

[tool.setuptools.packages.find]
include = ["carrot*"]

[tool.setuptools.package-data]
carrot = ["web/**/*"]
