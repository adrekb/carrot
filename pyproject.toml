[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "carrot"
version = "0.2.0"
description = "Carrot - On-device AI agent ecosystem with hybrid search, web search, and vision tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "duckduckgo-search>=8.1.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
]

[project.scripts]
carrot = "carrot.main:main"

[project.optional-dependencies]
dev = ["pytest", "httpx", "pylint"]