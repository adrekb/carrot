[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carrot"
version = "0.3.0"
description = "Carrot - On-device AI assistant with structured memory, local document search, agent tools, and hybrid model routing"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.11",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    # The maintained successor to duckduckgo-search, which was abandoned and
    # now proxies to Bing and returns unrelated results.
    "ddgs>=9.0.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.26.0",
    "psutil>=5.9.0",
    "pypdf>=4.0.0",
]

[project.scripts]
carrot = "carrot.main:main"

[project.optional-dependencies]
dev = ["pytest", "httpx", "pylint"]
# Optional cloud escalation. Carrot is fully functional without it — install
# only if you want the router to send hard reasoning work to a frontier model.
cloud = ["anthropic>=0.69.0"]
# Optional ANN backend. Without it the vector store falls back to a numpy scan,
# which is fine well past 100k vectors.
vectors = ["sqlite-vec>=0.1.6"]
speech = ["kokoro-onnx>=0.4.0", "sounddevice>=0.4.6"]
# Browser control for Carrot Agent. Needs a one-time browser download after
# install: `python -m playwright install chromium`. Without it the Agent tab
# says so instead of failing mid-task.
browser = ["playwright>=1.49.0"]
# Direct mouse and keyboard control. Off by default even once installed — it
# has to be switched on in Settings before the policy kernel will allow it.
desktop = ["pyautogui>=0.9.54"]

[tool.setuptools.packages.find]
include = ["carrot*"]

[tool.setuptools.package-data]
carrot = ["web/**/*"]
