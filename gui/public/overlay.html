<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrot — Quick Ask</title>
<style>
  /* A floating command bar. The window itself is transparent, so all the
     shape lives here.

     The blur is gone with the rest of the app's glass — a 97%-opaque fill
     exists to let a blur show through, and with no blur it is just an
     imprecise colour. The panel is solid now.

     The typeface is bundled beside this file rather than fetched from the
     backend. The overlay opens on a global shortcut and is often the first
     thing on screen; a font arriving over localhost once the backend has
     finished starting means the first frame is in Segoe UI and the second is
     not. `public/**/*` already ships in the Electron build, so this costs
     nothing to package. */
  @font-face {
    font-family: "Inter";
    src: url("Inter.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  /* Kept in step with the main window's palette. The overlay is a file://
     page, so it cannot read the app's stylesheet or its stored theme; the
     desktop shell relays the theme and stamps data-theme / data-accent on
     <html> (see the script at the end of this file), and the values are
     copied here by hand.

     Copied from the app's *computed* palette, not from the first `:root` in
     its stylesheet. That matters: style.css declares `--card` and `--accent`
     in more than one `:root` block and the later one wins, so reading the
     file top-down gives a cool slate palette the app has never actually
     rendered. Every value below was read out of a running window.

     What had drifted was small and all in the same direction — the panel a
     shade darker than a card, the stroke heavier, and `--sheen` left as
     `transparent`, which is why no hover in this panel did anything at all.

     A copied palette drifts, so the tests compare the two files and fail
     when they do. */
  :root {
    /* --panel is the app's --card: the value a floating surface sits at.
       --sheen is --card2, the surface above it that hovers land on. */
    --panel: #151517;
    --sheen: #1f1f23;
    --stroke: rgba(255, 255, 255, 0.08);
    --stroke-hi: rgba(255, 255, 255, 0.15);
    --text: #f4f4f6;
    --muted: #a0a0a8;
    --accent: #ff7a2b;
    --accent-soft: rgba(255, 122, 43, 0.18);
    --accent-line: rgba(255, 122, 43, 0.42);
    /* The accent as a *background for text* — a different requirement from
       the accent as ink — and the foreground that sits on it. One dark value
       cannot be right for both a yellow and a blue. */
    --accent-fill: #e0620f;
    --accent-hi: #ff9450;
    --on-accent: #1a1208;
    --faint: #8a8a93;
    /* The composer's own surface. Not --card: the app's command bar sits at
       `--surface-pop` behind a brighter edge than a card gets, because it
       floats over the page rather than sitting in it — which is exactly what
       this panel does. */
    --pop: #1a1a1e;
    --pop-edge: rgba(255, 255, 255, 0.14);
    --drop: rgba(0, 0, 0, 0.5);
    --drop-sm: rgba(0, 0, 0, 0.3);

    /* The app's type scale and radii, so a chip in here is the size a chip is
       out there. These were a rack of half-pixel one-offs — 10.5, 11.5, 12.5,
       13.5, 14.5 — five sizes, none of them the app's, no two of them a step
       apart. That is what a scale looks like before it is one. */
    --text-2xs: 11px;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-base: 14px;
    --text-md: 16px;
    --r-xs: 4px;
    --r-sm: 8px;
    --r-lg: 14px;
    --r-xl: 20px;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
  }
  :root[data-theme="light"] {
    --panel: #fffdf8;
    --sheen: #efe9db;
    --stroke: rgba(40, 34, 22, 0.11);
    --stroke-hi: rgba(40, 34, 22, 0.18);
    --text: #1e1b14;
    --muted: #5f584a;
    --faint: #6b6355;
    --pop: #ffffff;
    --pop-edge: rgba(38, 32, 26, 0.13);
    --drop: rgba(38, 30, 22, 0.22);
    --drop-sm: rgba(38, 30, 22, 0.12);
  }
  /* Ember's fill is #e8471f rather than the #df3d17 this file used to carry:
     that value sat in the gap between the two inks — 4.25 against
     --on-accent, 4.36 against white — so every filled ember surface failed AA
     by a little. The app lifted it; this had not. */
  :root[data-accent="ember"]  { --accent: #ff4f28; --accent-soft: rgba(255, 79, 40, 0.18);  --accent-line: rgba(255, 79, 40, 0.42); --accent-fill: #e8471f; --on-accent: #1a1208; }
  :root[data-accent="amber"]  { --accent: #ffab1a; --accent-soft: rgba(255, 171, 26, 0.18); --accent-line: rgba(255, 171, 26, 0.42); --accent-fill: #e09000; --on-accent: #1a1208; }
  :root[data-accent="orchid"] { --accent: #b95cf5; --accent-soft: rgba(185, 92, 245, 0.18); --accent-line: rgba(185, 92, 245, 0.42); --accent-fill: #8e2fd0; --on-accent: #ffffff; }
  :root[data-accent="teal"]   { --accent: #10c9a6; --accent-soft: rgba(16, 201, 166, 0.18); --accent-line: rgba(16, 201, 166, 0.42); --accent-fill: #0a9b80; --on-accent: #0a1a16; }
  :root[data-accent="indigo"] { --accent: #2f6bff; --accent-soft: rgba(47, 107, 255, 0.18); --accent-line: rgba(47, 107, 255, 0.44); --accent-fill: #1f55dd; --on-accent: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 14px;
    color: var(--text);
  }

  .bar {
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: var(--r-xl);
    box-shadow: 0 22px 60px var(--drop), 0 2px 6px var(--drop-sm);
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 11px;
    animation: rise 0.22s var(--ease);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(-6px) scale(0.985); }
    to   { opacity: 1; transform: none; }
  }

  input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: var(--text-base);
    letter-spacing: -0.01em;
    padding: 3px 0;
  }
  input::placeholder { color: var(--muted); }

  /* Was a bordered "Enter" chip, which is a key cap — a thing the app's
     composer does not have, because the send button is the affordance. So the
     chip is the send button now, and this is what is left of it: the states it
     was also carrying (Listening, Thinking, Mic blocked), as a quiet word
     rather than a boxed one. Empty when idle. */
  .hint {
    flex: 0 0 auto;
    font-size: var(--text-2xs);
    color: var(--faint);
    letter-spacing: 0.02em;
  }
  .hint:empty { display: none; }
  .hint.busy { color: var(--accent); }

  /* 36px, circular, accent-filled — `#send-btn`, to the pixel. It is the one
     control in the app's composer that is a filled circle, and it means send;
     drawing it any other way in here makes the panel a different app. */
  .send {
    flex: 0 0 auto;
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background 0.16s var(--ease), transform 0.12s var(--ease);
  }
  .send svg { width: 17px; height: 17px; }
  .send:hover { background: var(--accent-hi); }
  .send:active { transform: scale(0.94); }

  /* The reply lands under the bar; the window grows to fit it. */
  .reply {
    margin-top: 9px;
    background: var(--panel);
    border: 1px solid var(--stroke);
    border-radius: var(--r-lg);
    box-shadow: 0 22px 60px var(--drop);
    padding: 13px 15px;
    font-size: var(--text-sm);
    line-height: 1.62;
    color: var(--text);
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    animation: rise 0.22s var(--ease);
  }
  .reply.hidden { display: none; }
  .reply::-webkit-scrollbar { width: 8px; }
  .reply::-webkit-scrollbar-track { background: transparent; }
  .reply::-webkit-scrollbar-thumb {
    background: var(--sheen);
    border-radius: 5px;
    border: 2px solid transparent;
    background-clip: content-box;
  }
  .dots span {
    display: inline-block;
    width: 5px; height: 5px; margin-right: 3px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.18s; }
  .dots span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ---- The panel proper ----
     One surface holding the input, the attachment tray and the footer,
     rather than a bare bar. The bar keeps its own padding but drops the
     border and shadow now that the panel carries them. */
  /* The app's command bar, not a bar of our own.
     `--r-lg` and `--pop`, and the two-row layout its stylesheet insists on:
     "Two rows, always: the question, then the controls. Not a flex row that
     wraps under pressure — the rows are the design." This panel was that flex
     row: input, mic, paperclip and an Enter chip all on one line, which is a
     different product's idea of a command bar. */
  .panel {
    background: var(--pop);
    border: 1px solid var(--pop-edge);
    border-radius: var(--r-lg);
    box-shadow: 0 26px 70px var(--drop), 0 2px 8px var(--drop-sm);
    animation: rise 0.22s var(--ease);
    position: relative;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bar {
    background: none;
    border: 0;
    box-shadow: none;
    border-radius: 0;
    animation: none;
    padding: 0;
  }
  input { font-size: var(--text-md); }

  /* The control row. Same order as the app's: the things you add to the
     question on the left, the thing that sends it on the right. */
  .controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .icon {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 0;
    border-radius: var(--r-sm);
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .icon svg { width: 17px; height: 17px; }
  .icon:hover { background: var(--sheen); color: var(--text); }
  .icon.on { background: var(--accent-soft); color: var(--accent); }
  .icon.on svg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* Attachment chips */
  .tray {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tray.hidden { display: none; }
  .file {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 260px;
    padding: 5px 8px 5px 10px;
    border-radius: var(--r-sm);
    border: 1px solid var(--stroke);
    background: var(--sheen);
    font-size: var(--text-xs);
  }
  .file.bad { border-color: var(--accent-line); color: var(--accent); }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { color: var(--muted); font-size: var(--text-2xs); flex: 0 0 auto; }
  .file-x {
    border: 0; background: none; color: var(--muted);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px;
  }
  .file-x:hover { color: var(--text); }

  .spacer { flex: 1; }
  /* The app's `#search-btn`: a filled pill on the surface above the bar, with
     a hairline edge. It was a borderless ghost, which read as a label rather
     than a control — and it is the only thing in the panel you can change. */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: var(--r-sm);
    border: 1px solid var(--stroke);
    background: var(--sheen);
    color: var(--text);
    font: inherit;
    font-size: var(--text-xs);
    cursor: pointer;
  }
  .chip svg { width: 13px; height: 13px; color: var(--muted); }
  .chip:hover { border-color: var(--accent-line); }
  .key { font-size: var(--text-2xs); color: var(--muted); opacity: 0.75; }

  /* Workspace menu, anchored inside the panel so it cannot be clipped by
     the window — the window is only as tall as the content. */
  .menu {
    position: absolute;
    left: 12px;
    bottom: 52px;
    min-width: 210px;
    max-height: 190px;
    overflow-y: auto;
    padding: 5px;
    border-radius: var(--r-lg);
    background: var(--panel);
    border: 1px solid var(--stroke);
    box-shadow: 0 20px 50px var(--drop);
    z-index: 5;
  }
  .menu.hidden { display: none; }
  .menu-item {
    display: block; width: 100%;
    padding: 7px 9px;
    border: 0; border-radius: var(--r-sm);
    background: none; color: var(--text);
    font: inherit; font-size: var(--text-sm); text-align: left; cursor: pointer;
  }
  .menu-item:hover { background: var(--sheen); }
  /* Filled, like the main window's nav. A tint of the accent and an ordinary
     hover look almost identical, which on a short menu is the one piece of
     state it exists to communicate. */
  .menu-item.on {
    background: var(--accent-fill);
    color: var(--on-accent);
    border-radius: 999px;
  }
  .menu-empty { padding: 8px 9px; font-size: var(--text-xs); color: var(--muted); }

  /* Whole-panel drop target */
  body.dropping .panel {
    border-color: var(--accent-line);
    box-shadow: 0 26px 70px var(--drop), 0 0 0 3px var(--accent-soft);
  }
</style>
</head>
<body>
  <div class="panel">
    <!-- Row one: the question. The accent tile that used to sit to the left of
         it is gone — the app's composer has no leading mark, and a logo inside
         an input is a search box from another decade. -->
    <div class="bar">
      <input id="q" placeholder="Ask Carrot anything…" autofocus autocomplete="off" spellcheck="false">
    </div>

    <div class="tray hidden" id="tray"></div>

    <!-- Row two: what you can add to the question, then what sends it. Same
         order and the same controls as the app's, so the hand that has used
         one has used the other. -->
    <div class="controls">
      <button class="icon" id="dictate" title="Dictate (click, then speak)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><rect x="9.2" y="2.6" width="5.6" height="11" rx="2.8"/><path d="M5.4 11.2a6.6 6.6 0 0 0 13.2 0M12 17.8V21.4M8.6 21.4h6.8"/></svg>
      </button>
      <button class="icon" id="attach" title="Attach files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.8 8.8a5.3 5.3 0 0 1-7.5-7.5l9-9a3.5 3.5 0 0 1 5 5l-9 9a1.8 1.8 0 0 1-2.5-2.5l8.3-8.3"/></svg>
      </button>
      <button class="chip" id="ws" title="Ask inside a workspace">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 6.6a2 2 0 0 1 2-2h3.6l2.2 2.6h7.8a2 2 0 0 1 2 2v8.2a2 2 0 0 1-2 2H5.2a2 2 0 0 1-2-2z"/></svg>
        <span id="ws-label">All workspaces</span>
      </button>
      <span class="spacer"></span>
      <span class="hint" id="hint"></span>
      <span class="key">Esc</span>
      <button class="send" id="send" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>

    <div class="menu hidden" id="ws-menu"></div>
  </div>

  <div class="reply hidden" id="reply"></div>

<script>
  const input = document.getElementById('q');
  const hint = document.getElementById('hint');
  const reply = document.getElementById('reply');
  const tray = document.getElementById('tray');
  const wsLabel = document.getElementById('ws-label');
  const wsMenu = document.getElementById('ws-menu');
  const api = window.carrotAPI || {};

  let busy = false;
  let attachments = [];      // { name, mime, data, size }
  let workspaceId = '';
  let workspaces = [];

  function esc(text) {
    const div = document.createElement('div');
    div.textContent = String(text == null ? '' : text);
    return div.innerHTML;
  }

  function resize() {
    // Ask the shell to match the window to the content height. The panel
    // grows as attachments and a reply appear.
    const h = document.body.scrollHeight;
    if (api.resizeOverlay) api.resizeOverlay(Math.ceil(h) + 8);
  }

  function showReply(html) {
    reply.innerHTML = html;
    reply.classList.remove('hidden');
    requestAnimationFrame(resize);
  }

  function clearReply() {
    reply.classList.add('hidden');
    reply.textContent = '';
    requestAnimationFrame(resize);
  }

  // ---------- attachments ----------

  function renderTray() {
    if (!attachments.length) {
      tray.classList.add('hidden');
      tray.innerHTML = '';
      requestAnimationFrame(resize);
      return;
    }
    tray.classList.remove('hidden');
    tray.innerHTML = '';
    attachments.forEach((file, index) => {
      const chip = document.createElement('span');
      chip.className = 'file' + (file.error ? ' bad' : '');
      const size = file.size ? ` · ${Math.max(1, Math.round(file.size / 1024))} KB` : '';
      chip.innerHTML = `<span class="file-name">${esc(file.name)}</span>`
                     + `<span class="file-meta">${esc(file.error || size)}</span>`
                     + `<button class="file-x" aria-label="Remove">×</button>`;
      chip.querySelector('.file-x').onclick = () => {
        attachments.splice(index, 1);
        renderTray();
      };
      tray.appendChild(chip);
    });
    requestAnimationFrame(resize);
  }

  async function pickFiles() {
    if (!api.pickAttachments) return;
    const result = await api.pickAttachments();
    for (const file of (result.files || [])) attachments.push(file);
    renderTray();
    input.focus();
  }

  document.getElementById('attach').onclick = pickFiles;

  // ---------- dictation ----------
  // The Web Speech API ships with Chromium, so this needs no model and no
  // round trip. If it is unavailable the button hides rather than failing on
  // click — a button that does nothing is worse than one that is not there.
  let recogniser = null;
  let listening = false;
  const dictateBtn = document.getElementById('dictate');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    dictateBtn.style.display = 'none';
  } else {
    dictateBtn.onclick = () => {
      if (listening) { stopDictation(); return; }
      recogniser = new SpeechRecognition();
      recogniser.continuous = true;
      recogniser.interimResults = true;
      recogniser.lang = navigator.language || 'en-US';
      // Keep what was already typed; dictation appends rather than replaces.
      const base = input.value ? input.value.trimEnd() + ' ' : '';
      recogniser.onresult = (e) => {
        let text = '';
        for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
        input.value = base + text.trim();
      };
      recogniser.onerror = (e) => {
        stopDictation();
        hint.textContent = e.error === 'not-allowed' ? 'Mic blocked' : 'Mic error';
        setTimeout(() => { hint.textContent = ''; }, 2200);
      };
      recogniser.onend = () => stopDictation();
      try {
        recogniser.start();
        listening = true;
        dictateBtn.classList.add('on');
        hint.textContent = 'Listening';
        hint.classList.add('busy');
      } catch (_) { stopDictation(); }
    };
  }

  function stopDictation() {
    if (recogniser) { try { recogniser.stop(); } catch (_) {} }
    recogniser = null;
    listening = false;
    dictateBtn.classList.remove('on');
    hint.textContent = '';
    hint.classList.remove('busy');
    input.focus();
  }

  // Drag a file onto the panel. The renderer only gets a path, so the read
  // happens in the main process.
  document.addEventListener('dragover', (e) => {
    e.preventDefault();
    document.body.classList.add('dropping');
  });
  document.addEventListener('dragleave', (e) => {
    if (e.relatedTarget === null) document.body.classList.remove('dropping');
  });
  document.addEventListener('drop', async (e) => {
    e.preventDefault();
    document.body.classList.remove('dropping');
    if (!api.readAttachment) return;
    for (const file of Array.from(e.dataTransfer.files || [])) {
      const filePath = file.path || (window.webUtils && window.webUtils.getPathForFile
        ? window.webUtils.getPathForFile(file) : '');
      if (filePath) attachments.push(await api.readAttachment(filePath));
    }
    renderTray();
  });

  // Paste a screenshot straight in — the clipboard gives real bytes here, so
  // this path does not need the main process.
  document.addEventListener('paste', (e) => {
    for (const item of Array.from(e.clipboardData?.items || [])) {
      if (item.type && item.type.startsWith('image/')) {
        const blob = item.getAsFile();
        if (!blob) continue;
        const reader = new FileReader();
        reader.onload = () => {
          attachments.push({
            name: `pasted-image.${(item.type.split('/')[1] || 'png')}`,
            mime: item.type,
            data: String(reader.result).split(',')[1] || '',
            size: blob.size,
          });
          renderTray();
        };
        reader.readAsDataURL(blob);
      }
    }
  });

  // ---------- workspace ----------

  async function loadWorkspaces() {
    if (!api.listWorkspaces) return;
    try {
      const body = await api.listWorkspaces();
      workspaces = (body && body.workspaces) || [];
    } catch (_) { workspaces = []; }
  }

  function renderWorkspaceMenu() {
    wsMenu.innerHTML = '';
    const options = [{ id: '', name: 'All workspaces' }].concat(workspaces);
    for (const option of options) {
      const item = document.createElement('button');
      item.className = 'menu-item' + (option.id === workspaceId ? ' on' : '');
      item.textContent = option.name || option.id;
      item.onclick = () => {
        workspaceId = option.id;
        wsLabel.textContent = option.name || 'All workspaces';
        wsMenu.classList.add('hidden');
        input.focus();
      };
      wsMenu.appendChild(item);
    }
    if (!workspaces.length) {
      const note = document.createElement('div');
      note.className = 'menu-empty';
      note.textContent = 'No workspaces yet.';
      wsMenu.appendChild(note);
    }
  }

  document.getElementById('ws').onclick = async (e) => {
    e.stopPropagation();
    if (wsMenu.classList.contains('hidden')) {
      if (!workspaces.length) await loadWorkspaces();
      renderWorkspaceMenu();
      wsMenu.classList.remove('hidden');
      requestAnimationFrame(resize);
    } else {
      wsMenu.classList.add('hidden');
      requestAnimationFrame(resize);
    }
  };
  document.addEventListener('click', () => {
    if (!wsMenu.classList.contains('hidden')) {
      wsMenu.classList.add('hidden');
      requestAnimationFrame(resize);
    }
  });

  // ---------- asking ----------

  async function ask() {
    const text = input.value.trim();
    if ((!text && !attachments.length) || busy) return;
    const usable = attachments.filter(f => !f.error);
    busy = true;
    input.value = '';
    hint.textContent = 'Thinking';
    hint.classList.add('busy');
    showReply('<span class="dots"><span></span><span></span><span></span></span>');

    try {
      // Goes through the shell over IPC: the backend requires a session
      // token, and only the main process knows where it lives on disk.
      const res = await api.sendCommand({
        message: text,
        attachments: usable.map(f => ({ name: f.name, mime: f.mime, data: f.data })),
        workspace_id: workspaceId || undefined,
      });
      if (res && res.error) throw new Error(res.error);
      const answer = (res && (res.response || res.message || res.content)) || 'No response.';
      showReply(esc(answer));
      attachments = [];
      renderTray();
    } catch (err) {
      showReply(esc('Could not reach Carrot: ' + (err && err.message ? err.message : err)));
    } finally {
      busy = false;
      hint.textContent = '';
      hint.classList.remove('busy');
      input.focus();
    }
  }

  document.getElementById('send').addEventListener('click', () => ask());

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!wsMenu.classList.contains('hidden')) { wsMenu.classList.add('hidden'); return; }
      if (attachments.length) { attachments = []; renderTray(); return; }
      if (!reply.classList.contains('hidden')) { clearReply(); input.value = ''; return; }
      if (api.hideOverlay) api.hideOverlay();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
  });

  window.addEventListener('focus', () => input.focus());

  // The shell relays the main window's resolved theme; it arrives before
  // 'overlay-shown', so the panel is already repainted when it appears.
  if (api.onAppearance) {
    api.onAppearance((a) => {
      if (!a) return;
      document.documentElement.setAttribute('data-theme', a.theme === 'light' ? 'light' : 'dark');
      document.documentElement.setAttribute('data-accent', a.accent || 'carrot');
    });
  }

  if (api.onOverlayShown) {
    api.onOverlayShown(() => {
      input.value = '';
      attachments = [];
      renderTray();
      clearReply();
      loadWorkspaces();
      input.focus();
    });
  }
  loadWorkspaces();
  requestAnimationFrame(resize);
</script>
</body>
</html>
