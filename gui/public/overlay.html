<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrot - Voice Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: rgba(22, 33, 54, 0.95);
    backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    padding: 12px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 460px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .mic-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #e94560;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(233, 69, 96, 0); }
  }
  .input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 8px 14px;
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
  }
  .input:focus {
    border-color: #e94560;
  }
  .input::placeholder {
    color: #666;
  }
  .send-btn {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
  }
  .send-btn:hover { opacity: 0.85; }
  .status {
    font-size: 11px;
    color: #f5a623;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="mic-icon" title="Carrot is listening">🎤</div>
  <input type="text" class="input" id="voice-input" placeholder="Speak or type a command..." autofocus>
  <button class="send-btn" onclick="sendCommand()">Send</button>
  <div class="status" id="status">Alt+Space to toggle</div>

  <script>
    const input = document.getElementById('voice-input');
    const status = document.getElementById('status');

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendCommand();
    });

    async function sendCommand() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      status.textContent = 'Thinking...';

      try {
        const res = await fetch('http://127.0.0.1:8181/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        status.textContent = '✓ Done';
        setTimeout(() => { status.textContent = 'Alt+Space to toggle'; }, 2000);

        if (window.parent && window.parent.postMessage) {
          window.parent.postMessage({ type: 'carrot-response', data }, '*');
        }
      } catch (e) {
        status.textContent = 'Error';
        setTimeout(() => { status.textContent = 'Alt+Space to toggle'; }, 2000);
      }
    }
  </script>
</body>
</html>
